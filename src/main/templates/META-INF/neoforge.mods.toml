modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "kameron"
description = '''
Adds obsidian gear to the game: a full set of obsidian tools (pickaxe, axe, shovel, hoe), an obsidian sword, and obsidian arrows. Obsidian gear sits at the top tier — durable, fast, and hard-hitting — crafted from Obsidian Shards.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
